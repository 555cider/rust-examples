{% extends "layouts/base_auth.html" %}

{% block title %}로그인{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const loginForm = document.getElementById('loginForm');

        if (loginForm) {
            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                console.log('Form submission intercepted');

                const formData = new URLSearchParams(new FormData(loginForm));
                console.log('Form data:', Object.fromEntries(formData.entries()));

                try {
                    console.log('Sending request to:', loginForm.action);
                    const response = await fetch(loginForm.action, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: formData
                    });

                    const data = await response.json();
                    console.log('Response received:', data);

                    if (response.ok && data.redirect_url) {
                        console.log('Login successful, redirecting to:', data.redirect_url);
                        // Store the token if needed for future API calls
                        if (data.access_token) {
                            localStorage.setItem('access_token', data.access_token);
                        }
                        // Redirect to the provided URL
                        window.location.href = data.redirect_url;
                    } else {
                        // Handle login error
                        console.error('Login failed:', data);
                        // You might want to show an error message to the user here
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'bg-red-50 border-l-4 border-red-500 p-4 mb-4';
                        errorDiv.innerHTML = `
                        <div class="flex">
                            <div class="flex-shrink-0">
                                <i class="fas fa-exclamation-circle text-red-500"></i>
                            </div>
                            <div class="ml-3">
                                <p class="text-sm text-red-700">로그인에 실패했습니다. 아이디와 비밀번호를 확인해주세요.</p>
                            </div>
                        </div>`;

                        // Remove any existing error messages
                        const existingError = loginForm.querySelector('.bg-red-50');
                        if (existingError) {
                            existingError.remove();
                        }

                        // Insert the new error message
                        loginForm.insertBefore(errorDiv, loginForm.firstChild);
                    }
                } catch (error) {
                    console.error('Error during login:', error);
                    // Handle network errors
                }
            });
        }
    });
</script>
{% endblock %}

{% block content %}
<div class="sm:mx-auto sm:w-full sm:max-w-md animate-fade-in">
    <div class="glass-card py-10 px-6 shadow-2xl rounded-2xl sm:px-12 relative overflow-hidden">
        <!-- Decorative elements -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary-400 via-primary-500 to-primary-600">
        </div>

        <div class="mb-10 text-center">
            <div
                class="mx-auto h-16 w-16 rounded-2xl bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center shadow-lg shadow-primary-500/30 transform rotate-3 hover:rotate-6 transition-transform duration-300">
                <i class="fas fa-shield-alt text-3xl text-white"></i>
            </div>
            <h2 class="mt-6 text-3xl font-bold tracking-tight text-gray-900">
                Welcome Back
            </h2>
            <p class="mt-2 text-sm text-gray-600">
                관리자 계정으로 로그인하세요
            </p>
        </div>

        {% if error %}
        <div class="mb-6 rounded-lg bg-red-50 p-4 border border-red-100 animate-slide-up">
            <div class="flex">
                <div class="flex-shrink-0">
                    <i class="fas fa-exclamation-circle text-red-400"></i>
                </div>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-red-800">로그인 실패</h3>
                    <div class="mt-1 text-sm text-red-700">{{ error }}</div>
                </div>
            </div>
        </div>
        {% endif %}

        <form id="loginForm" class="space-y-6" action="/api/auth/login" method="POST">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">아이디</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-user text-gray-400 text-sm"></i>
                    </div>
                    <input id="username" name="username" type="text" required
                        class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl leading-5 bg-white/50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent sm:text-sm transition-all duration-200 hover:bg-white/80"
                        placeholder="admin">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">비밀번호</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-gray-400 text-sm"></i>
                    </div>
                    <input id="password" name="password" type="password" required
                        class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl leading-5 bg-white/50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent sm:text-sm transition-all duration-200 hover:bg-white/80"
                        placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember" name="remember" type="checkbox"
                        class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded transition-colors duration-200">
                    <label for="remember" class="ml-2 block text-sm text-gray-600 select-none">
                        로그인 유지
                    </label>
                </div>
            </div>

            <div>
                <button type="submit"
                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-500 hover:to-primary-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 shadow-lg shadow-primary-500/30 transform transition-all duration-200 hover:-translate-y-0.5">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i
                            class="fas fa-sign-in-alt text-primary-300 group-hover:text-primary-200 transition-colors"></i>
                    </span>
                    로그인
                </button>
            </div>
        </form>

        <div class="mt-8 text-center">
            <p class="text-sm text-gray-500">
                계정이 없으신가요?
                <a href="/auth/register" class="font-medium text-primary-600 hover:text-primary-500 transition-colors">
                    회원가입하기
                </a>
            </p>
        </div>
    </div>

    <p class="mt-8 text-center text-xs text-gray-500">
        &copy; 2025 Admin Server. All rights reserved.
    </p>
</div>
{% endblock %}
