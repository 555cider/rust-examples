{% extends "layouts/base_auth.html" %}

{% block title %}회원가입{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const registerForm = document.getElementById('registerForm');

        if (registerForm) {
            registerForm.addEventListener('submit', async function (e) {
                e.preventDefault();

                // Basic validation
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm_password').value;

                if (password !== confirmPassword) {
                    showError('비밀번호가 일치하지 않습니다.');
                    return;
                }

                const formData = new FormData(registerForm);
                // Convert FormData to JSON object
                const data = Object.fromEntries(formData.entries());

                // Ensure role_id is a number
                if (data.role_id) {
                    data.role_id = parseInt(data.role_id, 10);
                }

                // Handle checkbox
                data.is_active = true; // Default to true for registration

                try {
                    const response = await fetch('/api/v1/user', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        // Success
                        const successDiv = document.createElement('div');
                        successDiv.className = 'mb-6 rounded-lg bg-green-50 p-4 border border-green-100 animate-slide-up';
                        successDiv.innerHTML = `
                            <div class="flex">
                                <div class="flex-shrink-0">
                                    <i class="fas fa-check-circle text-green-400"></i>
                                </div>
                                <div class="ml-3">
                                    <h3 class="text-sm font-medium text-green-800">회원가입 성공</h3>
                                    <div class="mt-1 text-sm text-green-700">
                                        계정이 생성되었습니다. <a href="/auth/login" class="font-medium underline hover:text-green-600">로그인하기</a>
                                    </div>
                                </div>
                            </div>`;

                        const formContainer = document.querySelector('.glass-card');
                        formContainer.innerHTML = '';
                        formContainer.appendChild(successDiv);

                        // Redirect after 2 seconds
                        setTimeout(() => {
                            window.location.href = '/auth/login';
                        }, 2000);
                    } else {
                        const errorData = await response.json();
                        showError(errorData.message || '회원가입 중 오류가 발생했습니다.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showError('서버 통신 중 오류가 발생했습니다.');
                }
            });
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'mb-6 rounded-lg bg-red-50 p-4 border border-red-100 animate-slide-up';
            errorDiv.innerHTML = `
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i class="fas fa-exclamation-circle text-red-400"></i>
                    </div>
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-red-800">오류 발생</h3>
                        <div class="mt-1 text-sm text-red-700">${message}</div>
                    </div>
                </div>`;

            const existingError = registerForm.querySelector('.bg-red-50');
            if (existingError) {
                existingError.remove();
            }

            registerForm.insertBefore(errorDiv, registerForm.firstChild);
        }
    });
</script>
{% endblock %}

{% block content %}
<div class="sm:mx-auto sm:w-full sm:max-w-md animate-fade-in">
    <div class="glass-card py-10 px-6 shadow-2xl rounded-2xl sm:px-12 relative overflow-hidden">
        <!-- Decorative elements -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary-400 via-primary-500 to-primary-600">
        </div>

        <div class="mb-8 text-center">
            <h2 class="text-3xl font-bold tracking-tight text-gray-900">
                Create Account
            </h2>
            <p class="mt-2 text-sm text-gray-600">
                새로운 관리자 계정을 생성합니다
            </p>
        </div>

        <form id="registerForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">아이디</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-user text-gray-400 text-sm"></i>
                    </div>
                    <input id="username" name="username" type="text" required
                        class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl leading-5 bg-white/50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent sm:text-sm transition-all duration-200 hover:bg-white/80"
                        placeholder="사용할 아이디">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">비밀번호</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-gray-400 text-sm"></i>
                    </div>
                    <input id="password" name="password" type="password" required
                        class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl leading-5 bg-white/50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent sm:text-sm transition-all duration-200 hover:bg-white/80"
                        placeholder="••••••••">
                </div>
            </div>

            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-700">비밀번호 확인</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-check-circle text-gray-400 text-sm"></i>
                    </div>
                    <input id="confirm_password" name="confirm_password" type="password" required
                        class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl leading-5 bg-white/50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent sm:text-sm transition-all duration-200 hover:bg-white/80"
                        placeholder="••••••••">
                </div>
            </div>

            <div>
                <label for="role_id" class="block text-sm font-medium text-gray-700">역할 ID</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-id-badge text-gray-400 text-sm"></i>
                    </div>
                    <input id="role_id" name="role_id" type="number" min="1" required
                        class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl leading-5 bg-white/50 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent sm:text-sm transition-all duration-200 hover:bg-white/80"
                        placeholder="1">
                </div>
                <p class="mt-1 text-xs text-gray-500">기본 역할 ID를 입력하세요 (예: 1)</p>
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-gradient-to-r from-primary-600 to-primary-500 hover:from-primary-500 hover:to-primary-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 shadow-lg shadow-primary-500/30 transform transition-all duration-200 hover:-translate-y-0.5">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-user-plus text-primary-300 group-hover:text-primary-200 transition-colors"></i>
                    </span>
                    회원가입
                </button>
            </div>
        </form>

        <div class="mt-8 text-center">
            <p class="text-sm text-gray-500">
                이미 계정이 있으신가요?
                <a href="/auth/login" class="font-medium text-primary-600 hover:text-primary-500 transition-colors">
                    로그인하기
                </a>
            </p>
        </div>
    </div>

    <p class="mt-8 text-center text-xs text-gray-500">
        &copy; 2025 Admin Server. All rights reserved.
    </p>
</div>
{% endblock %}
