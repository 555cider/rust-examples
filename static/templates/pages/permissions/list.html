{% extends "layouts/base.html" %}

{% block title %}권한 관리{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto animate-fade-in">
    <!-- Page Header -->
    <div class="page-header mb-8">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="page-title flex items-center gap-2">
                    권한 관리
                    <span class="badge badge-blue text-xs align-middle">Role-Based</span>
                </h1>
                <p class="page-description">시스템 접근 권한을 관리하고 설정합니다.</p>
            </div>
            <button onclick="openPermissionModal()" class="btn-primary shadow-lg shadow-primary-500/30">
                <i class="fas fa-plus mr-2"></i> 권한 추가
            </button>
        </div>
    </div>

    <!-- Search Section -->
    <div class="glass-card rounded-2xl shadow-lg p-6 mb-8">
        <div class="flex flex-col sm:flex-row gap-4">
            <div class="relative flex-grow">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fas fa-search text-gray-400"></i>
                </div>
                <input type="text" id="search" class="input-field pl-11 w-full" placeholder="권한 코드, 설명으로 검색...">
            </div>
            <button type="button" id="searchButton" class="btn-secondary whitespace-nowrap">
                <i class="fas fa-search mr-2"></i> 검색
            </button>
        </div>
    </div>

    <!-- Content Section -->
    <div class="glass-card rounded-2xl shadow-xl overflow-hidden">
        <!-- Mobile View -->
        <div class="block md:hidden" id="mobile-permissions">
            <!-- Dynamic content will be inserted here by JavaScript -->
        </div>

        <!-- Desktop View -->
        <div class="hidden md:block overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="bg-gray-50/50 border-b border-gray-200">
                        <th scope="col"
                            class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 transition-colors"
                            onclick="handleSort('id')" data-sort="id">
                            ID <i class="sort-icon fas fa-sort text-gray-300 ml-1"></i>
                        </th>
                        <th scope="col"
                            class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 transition-colors"
                            onclick="handleSort('code')" data-sort="code">
                            권한 코드 <i class="sort-icon fas fa-sort text-gray-300 ml-1"></i>
                        </th>
                        <th scope="col"
                            class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 transition-colors"
                            onclick="handleSort('name')" data-sort="name">
                            권한명 <i class="sort-icon fas fa-sort text-gray-300 ml-1"></i>
                        </th>
                        <th scope="col"
                            class="px-6 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 transition-colors"
                            onclick="handleSort('created_at')" data-sort="created_at">
                            생성일 <i class="sort-icon fas fa-sort text-gray-300 ml-1"></i>
                        </th>
                        <th scope="col"
                            class="px-6 py-4 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            관리
                        </th>
                    </tr>
                </thead>
                <tbody id="permissions-table-body" class="divide-y divide-gray-200 bg-white/50 backdrop-blur-sm">
                    <!-- Dynamic content will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="px-6 py-4 border-t border-gray-200 bg-gray-50/50 pagination">
            <!-- Dynamic pagination will be inserted here by JavaScript -->
        </div>
    </div>

    <!-- Permission Modal -->
    <div id="permissionModal" class="modal">
        <div class="modal-backdrop" onclick="closePermissionModal()"></div>
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modalTitle" class="modal-title">권한 추가</h3>
                    <button type="button" class="modal-close" onclick="closePermissionModal()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <form id="permissionForm">
                    <div class="modal-body">
                        <input type="hidden" id="permissionId">

                        <div class="form-group">
                            <label for="code" class="input-label">권한 코드 <span class="text-error-600">*</span></label>
                            <input type="text" id="code" name="code" required class="input-field"
                                placeholder="예: user:read">
                            <span id="code-error" class="input-error"></span>
                        </div>

                        <div class="form-group">
                            <label for="name" class="input-label">권한명 <span class="text-error-600">*</span></label>
                            <input type="text" id="name" name="name" required class="input-field"
                                placeholder="예: 사용자 읽기">
                            <span id="name-error" class="input-error"></span>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" onclick="closePermissionModal()">취소</button>
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-save mr-2"></i>
                            <span id="submit-btn-text">추가</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}

<script src="/static/js/permissions/list.js?v=1763767000"></script>
{% endblock %}
