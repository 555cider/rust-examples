{% extends "layouts/base.html" %}

{% block title %}오류 발생{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center p-4">
    <div class="glass-card max-w-lg w-full p-8 rounded-2xl shadow-2xl text-center animate-fade-in">
        <div class="mb-6 relative">
            <div class="absolute inset-0 bg-red-100 rounded-full blur-xl opacity-50 animate-pulse"></div>
            <div class="relative w-24 h-24 bg-red-50 rounded-full flex items-center justify-center mx-auto">
                <i class="fas fa-exclamation-triangle text-4xl text-red-500"></i>
            </div>
        </div>

        <h1 class="text-3xl font-bold text-gray-900 mb-2">오류가 발생했습니다</h1>

        <div class="bg-red-50 rounded-xl p-4 mb-6 border border-red-100">
            <p class="text-red-700 font-medium">
                {% if error %}
                {{ error }}
                {% else %}
                알 수 없는 오류가 발생했습니다.
                {% endif %}
            </p>
        </div>

        <div class="space-y-4">
            <p class="text-gray-500 text-sm">
                문제가 지속되면 관리자에게 문의해주세요.
            </p>

            <div class="flex flex-col sm:flex-row gap-3 justify-center mt-8">
                <button onclick="history.back()" class="btn-secondary flex items-center justify-center gap-2">
                    <i class="fas fa-arrow-left"></i>
                    <span>이전 페이지</span>
                </button>
                <a href="/dashboard" class="btn-primary flex items-center justify-center gap-2">
                    <i class="fas fa-home"></i>
                    <span>대시보드</span>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
