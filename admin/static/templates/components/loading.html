<!-- Loading Spinner - Small -->
<div class="loading-spinner-sm inline-flex items-center justify-center">
    <div class="animate-spin rounded-full h-5 w-5 border-t-2 border-b-2 border-primary-600"></div>
</div>

<!-- Loading Spinner - Medium -->
<div class="loading-spinner flex items-center justify-center">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary-600"></div>
</div>

<!-- Loading Spinner - Large -->
<div class="loading-spinner-lg flex items-center justify-center">
    <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-primary-600"></div>
</div>

<!-- Loading Overlay with Progress Message -->
<div id="loading-overlay" class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full mx-4">
        <div class="flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary-600 mb-4"></div>
            <h3 id="loading-title" class="text-lg font-semibold text-gray-900 mb-1">데이터를 불러오는 중</h3>
            <p id="loading-message" class="text-gray-600 text-center">잠시만 기다려주세요...</p>
            <div class="mt-4 w-full bg-gray-200 rounded-full h-1.5">
                <div class="bg-primary-600 h-1.5 rounded-full animate-pulse" style="width: 45%"></div>
            </div>
        </div>
    </div>
</div>

<!-- Inline Loading Spinner with Text -->
<div class="inline-loading flex items-center space-x-2">
    <div class="animate-spin rounded-full h-4 w-4 border-t-2 border-b-2 border-primary-600"></div>
    <span class="text-sm text-gray-600">로딩 중...</span>
</div>

<!-- Skeleton Loader - Text Lines -->
<div class="skeleton-loader animate-pulse space-y-4">
    <div class="h-4 bg-gray-200 rounded w-3/4"></div>
    <div class="h-4 bg-gray-200 rounded"></div>
    <div class="h-4 bg-gray-200 rounded w-5/6"></div>
</div>

<!-- Skeleton Loader - Card -->
<div class="skeleton-card animate-pulse">
    <div class="bg-white rounded-xl border border-gray-200 p-6 space-y-4">
        <div class="h-6 bg-gray-200 rounded w-1/2"></div>
        <div class="space-y-2">
            <div class="h-4 bg-gray-200 rounded"></div>
            <div class="h-4 bg-gray-200 rounded w-5/6"></div>
            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
        </div>
        <div class="flex space-x-2">
            <div class="h-8 bg-gray-200 rounded w-20"></div>
            <div class="h-8 bg-gray-200 rounded w-20"></div>
        </div>
    </div>
</div>

<!-- Skeleton Loader - Table -->
<div class="skeleton-table animate-pulse">
    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <!-- Header -->
        <div class="bg-gray-50 px-6 py-3 border-b border-gray-200">
            <div class="flex space-x-4">
                <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/4"></div>
            </div>
        </div>
        <!-- Rows -->
        <div class="divide-y divide-gray-200">
            <div class="px-6 py-4">
                <div class="flex space-x-4">
                    <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                </div>
            </div>
            <div class="px-6 py-4">
                <div class="flex space-x-4">
                    <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                </div>
            </div>
            <div class="px-6 py-4">
                <div class="flex space-x-4">
                    <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Skeleton Loader - Form -->
<div class="skeleton-form animate-pulse space-y-4">
    <div>
        <div class="h-4 bg-gray-200 rounded w-1/4 mb-2"></div>
        <div class="h-10 bg-gray-200 rounded"></div>
    </div>
    <div>
        <div class="h-4 bg-gray-200 rounded w-1/3 mb-2"></div>
        <div class="h-10 bg-gray-200 rounded"></div>
    </div>
    <div>
        <div class="h-4 bg-gray-200 rounded w-1/5 mb-2"></div>
        <div class="h-24 bg-gray-200 rounded"></div>
    </div>
    <div class="flex space-x-2">
        <div class="h-10 bg-gray-200 rounded w-24"></div>
        <div class="h-10 bg-gray-200 rounded w-24"></div>
    </div>
</div>

<!-- Table Loading State -->
<tr class="table-loading">
    <td colspan="100" class="px-6 py-8 text-center">
        <div class="flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-primary-600 mb-3"></div>
            <p class="text-sm text-gray-500">데이터를 불러오는 중입니다...</p>
        </div>
    </td>
</tr>

<!-- Button Loading State -->
<button type="button" class="btn-loading" disabled>
    <div class="flex items-center justify-center space-x-2">
        <div class="animate-spin rounded-full h-4 w-4 border-t-2 border-b-2 border-white"></div>
        <span>처리 중...</span>
    </div>
</button>
