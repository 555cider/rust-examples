[package]
name = "admin-server"
version = "0.1.0"
edition = "2021"

[features]
default = ["swagger-ui"]
swagger-ui = ["dep:utoipa-swagger-ui"]

[dependencies]
# Web framework
axum = { version = "0.7.9", features = ["tokio", "json", "macros"] }
axum-extra = { version = "0.9.0", features = ["typed-header"] }
tower-http = { version = "0.5.2", features = ["cors", "fs", "request-id", "sensitive-headers", "trace", "util", "compression-br"] }
tower = { version = "0.5.2", features = ["util"] }
http = "1.1.0"

# Async runtime
tokio = { version = "1.45.1", features = ["rt-multi-thread", "signal", "time", "fs", "macros"] }
async-trait = "0.1.88"

# Database
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "chrono",
] }

# Templating
tera = "1.20.0"

# Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140" }
serde_with = { version = "3.8.0", features = ["macros"] }

# Authentication & Security
bcrypt = "0.17.0"
jsonwebtoken = "9.3.1"
cookie = "0.18.1"
uuid = { version = "1.17.0", features = ["v4", "serde"] }

# Date and time
chrono = { version = "0.4.41", features = ["serde"] }
time = { version = "0.3.41", features = ["serde", "formatting", "parsing"] }

# Error handling
anyhow = "1.0.94"
thiserror = "2.0.12"

# Logging
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# Configuration
dotenvy = "0.15.7"

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# URL encoding
urlencoding = "2.1.3"

# Regular expressions
regex = "1.11.1"

# Lock-free data structures
arc-swap = "1.7"
dashmap = "6.1"

# API Documentation
utoipa = { version = "5.2.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "8.0.0", features = ["axum"], optional = true }

[dev-dependencies]
# Testing framework
tokio-test = "0.4.4"
axum-test = "18.1.0"
tower = { version = "0.5.2", features = ["util"] }
http-body-util = "0.1.2"
tempfile = "3.13.0"

[profile.release]
# Optimize for binary size and performance
opt-level = 3              # Maximum optimization for speed
lto = "thin"               # Link-time optimization (thin is faster to compile)
codegen-units = 1          # Better optimization, slower compile
strip = true               # Remove debug symbols
panic = "abort"            # Smaller binary, no unwinding

[profile.release.package."*"]
opt-level = 3              # Optimize all dependencies

[profile.dev.package."*"]
opt-level = 0              # Fast compilation in dev mode






