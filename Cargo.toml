[package]
name = "hyper-gateway"
version = "0.1.0"
authors = ["my <sosnsg@gmail.com>"]
edition = "2018"

[dependencies]
tokio = { version = "1.51.1", features = ["full"] }
hyper = { version = "1.9.0", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1"

rusqlite = { version = "0.29.0", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.22.0"

log = "0.4.18"
env_logger = "0.10.0"
chrono = "0.4.26"
serde = { version = "1.0.163", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9.21"
fastrand = "2.0.0"
rustls = "0.23"
rustls-pemfile = "2.2.0"
tokio-rustls = "0.26.2"
webpki-roots = "0.26.8"

[dev-dependencies]
rcgen = "0.13.2"
