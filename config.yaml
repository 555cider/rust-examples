---
server:
  listen: 127.0.0.1:8080
spring:
  cloud:
    gateway:
      routes:
        - id: something
          uri: http://127.0.0.1:8001
          predicates:
            - Path=/something/**
        - id: product
          uri: http://127.0.0.1:8001
          predicates:
            - Path=/product/**
        - id: fallback
          uri: http://127.0.0.1:8001
          predicates:
            - Path=/**
